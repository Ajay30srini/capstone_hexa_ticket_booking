services:
  db:
    image: postgres:15
    container_name: ticket_booking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ajay30
      POSTGRES_DB: ticket_booking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_ticket_booking:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ticket_booking_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata_ticket_booking: